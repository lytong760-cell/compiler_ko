name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. v0.1.0-beta)"
        required: false
        default: "v0.1.0-beta"

permissions:
  contents: write

jobs:
  # -------------------------
  # Linux x86_64
  # -------------------------
  build-linux-x64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: |
          zig build -Dtarget=x86_64-linux-gnu -p zig-out-x64
          ls -la zig-out-x64/bin/ zig-out-x64/lib/

      - name: Test
        run: |
          cd zig-out-x64/bin && export LD_LIBRARY_PATH=../lib:$LD_LIBRARY_PATH && ./ko --version

      - name: Package
        run: |
          mkdir -p ko-linux-x64/bin ko-linux-x64/lib
          cp zig-out-x64/bin/ko ko-linux-x64/bin/
          cp zig-out-x64/lib/*.so ko-linux-x64/lib/
          cp zig-out-x64/bin/mod_check ko-linux-x64/bin/ 2>/dev/null || true
          tar -czvf compiler-ko-linux-x64.tar.gz ko-linux-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ko-linux-x64
          path: compiler-ko-linux-x64.tar.gz

  # -------------------------
  # Linux aarch64
  # -------------------------
  build-linux-arm64:
    name: Build Linux aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: |
          zig build -Dtarget=aarch64-linux-gnu -p zig-out-arm64
          ls -la zig-out-arm64/bin/ zig-out-arm64/lib/

      - name: Package
        run: |
          mkdir -p ko-linux-arm64/bin ko-linux-arm64/lib
          cp zig-out-arm64/bin/ko ko-linux-arm64/bin/
          cp zig-out-arm64/lib/*.so ko-linux-arm64/lib/
          cp zig-out-arm64/bin/mod_check ko-linux-arm64/bin/ 2>/dev/null || true
          tar -czvf compiler-ko-linux-arm64.tar.gz ko-linux-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ko-linux-arm64
          path: compiler-ko-linux-arm64.tar.gz

  # -------------------------
  # macOS x86_64
  # -------------------------
  build-macos-x64:
    name: Build macOS x86_64
    runs-on: macos-13
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: |
          zig build -Dtarget=x86_64-macos -p zig-out-x64
          ls -la zig-out-x64/bin/ zig-out-x64/lib/

      - name: Test
        run: |
          cd zig-out-x64/bin && export DYLD_LIBRARY_PATH=../lib:$DYLD_LIBRARY_PATH && ./ko --version

      - name: Package
        run: |
          mkdir -p ko-macos-x64/bin ko-macos-x64/lib
          cp zig-out-x64/bin/ko ko-macos-x64/bin/
          cp zig-out-x64/lib/*.dylib ko-macos-x64/lib/
          cp zig-out-x64/bin/mod_check ko-macos-x64/bin/ 2>/dev/null || true
          tar -czvf compiler-ko-macos-x64.tar.gz ko-macos-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ko-macos-x64
          path: compiler-ko-macos-x64.tar.gz

  # -------------------------
  # macOS aarch64
  # -------------------------
  build-macos-arm64:
    name: Build macOS aarch64
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: |
          zig build -Dtarget=aarch64-macos -p zig-out-arm64
          ls -la zig-out-arm64/bin/ zig-out-arm64/lib/

      - name: Test
        run: |
          cd zig-out-arm64/bin && export DYLD_LIBRARY_PATH=../lib:$DYLD_LIBRARY_PATH && ./ko --version

      - name: Package
        run: |
          mkdir -p ko-macos-arm64/bin ko-macos-arm64/lib
          cp zig-out-arm64/bin/ko ko-macos-arm64/bin/
          cp zig-out-arm64/lib/*.dylib ko-macos-arm64/lib/
          cp zig-out-arm64/bin/mod_check ko-macos-arm64/bin/ 2>/dev/null || true
          tar -czvf compiler-ko-macos-arm64.tar.gz ko-macos-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ko-macos-arm64
          path: compiler-ko-macos-arm64.tar.gz

  # -------------------------
  # Windows x86_64
  # -------------------------
  build-windows-x64:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: |
          zig build -Dtarget=x86_64-windows-gnu -p zig-out-x64
          ls -la zig-out-x64/bin/ zig-out-x64/lib/

      - name: Test
        run: |
          cd zig-out-x64/bin && .\ko.exe --version

      - name: Package
        run: |
          mkdir -p ko-windows-x64/bin ko-windows-x64/lib
          cp zig-out-x64/bin/ko.exe ko-windows-x64/bin/
          cp zig-out-x64/lib/*.dll ko-windows-x64/lib/
          cp zig-out-x64/bin/ko_loop.dll ko-windows-x64/bin/ 2>/dev/null || true
          Compress-Archive -Path ko-windows-x64 -DestinationPath compiler-ko-windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-ko-windows-x64
          path: compiler-ko-windows-x64.zip

  # -------------------------
  # Create Release
  # -------------------------
  create-release:
    name: Create Release
    needs: [build-linux-x64, build-linux-arm64, build-macos-x64, build-macos-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "compiler_ko ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body: |
            ## compiler_ko ${{ github.ref_name }}

            Cross-platform release build.

            ### Assets
            - **Linux x86_64**: `compiler-ko-linux-x64.tar.gz`
            - **Linux aarch64**: `compiler-ko-linux-arm64.tar.gz`
            - **macOS x86_64**: `compiler-ko-macos-x64.tar.gz`
            - **macOS aarch64**: `compiler-ko-macos-arm64.tar.gz`
            - **Windows x86_64**: `compiler-ko-windows-x64.zip`

            ### Installation
            Extract the archive and add the `bin` directory to your `PATH`.
            On Linux/macOS, set `LD_LIBRARY_PATH` / `DYLD_LIBRARY_PATH` to the `lib` directory.
