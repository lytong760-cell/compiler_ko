name: Web Terminal

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to keep the terminal alive (minutes, max 360)"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  # -------------------------
  # Linux (bash) web terminal
  # -------------------------
  linux-terminal:
    name: Linux Web Terminal
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build ko
        run: |
          zig build
          zig build test --summary all
          echo "=== ko ready ==="
          ./zig-out/bin/ko --version

      - name: Install ttyd + cloudflared
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttyd
          # cloudflared quick tunnel (no auth needed)
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start web terminal
        env:
          TERMINAL_USERNAME: ${{ secrets.TERMINAL_USERNAME }}
          TERMINAL_PASSWORD: ${{ secrets.TERMINAL_PASSWORD }}
        run: |
          if [ -z "$TERMINAL_USERNAME" ] || [ -z "$TERMINAL_PASSWORD" ]; then
            echo "::error::Set TERMINAL_USERNAME and TERMINAL_PASSWORD repository secrets before starting the public terminal."
            exit 1
          fi
          export LD_LIBRARY_PATH=$PWD/zig-out/lib:$LD_LIBRARY_PATH
          # Clean up any stale ttyd process from a previous run
          pkill -f ttyd || true
          # Require credentials because the quick tunnel URL is publicly reachable.
          ttyd -W -p 8899 -c "$TERMINAL_USERNAME:$TERMINAL_PASSWORD" bash &
          # Đợi ttyd listen trên port 8899 (tránh 504 khi cloudflared kết nối sớm quá)
          for i in $(seq 1 30); do
            if command -v nc >/dev/null 2>&1; then
              nc -z localhost 8899 && break
            elif command -v bash >/dev/null 2>&1; then
              bash -c 'echo > /dev/tcp/localhost/8899' 2>/dev/null && break
            fi
            sleep 1
          done
          echo "=== PUBLIC URL BELOW (open in browser) ==="
          /tmp/cloudflared tunnel --url http://localhost:8899 2>&1 | tee /tmp/tunnel.log &
          TUNNEL_PID=$!
          # Đợi cloudflared in URL tunnel (https://....trycloudflare.com) vào log
          for i in $(seq 1 30); do
            if grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log 2>/dev/null | head -1; then
              break
            fi
            sleep 1
          done
          # Keep alive for the requested duration
          DUR=${{ github.event.inputs.duration || 60 }}
          echo "Keeping terminal alive for ${DUR} minutes..."
          sleep $((DUR * 60))
          kill $TUNNEL_PID 2>/dev/null || true

  # -------------------------
  # Windows (PowerShell) web terminal
  # -------------------------
  windows-terminal:
    name: Windows PowerShell Web Terminal
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build ko
        shell: pwsh
        run: |
          zig build
          zig build test --summary all
          Write-Host "=== ko ready ==="
          .\zig-out\bin\ko.exe --version

      - name: Install ttyd + cloudflared (Windows)
        shell: pwsh
        run: |
          # ttyd Windows binary
          $ttydUrl = "https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.win32.exe"
          Invoke-WebRequest -Uri $ttydUrl -OutFile "ttyd.exe"
          # cloudflared Windows binary
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $cfUrl -OutFile "cloudflared.exe"
          .\ttyd.exe --version
          .\cloudflared.exe --version

      - name: Start PowerShell web terminal
        shell: pwsh
        env:
          TERMINAL_USERNAME: ${{ secrets.TERMINAL_USERNAME }}
          TERMINAL_PASSWORD: ${{ secrets.TERMINAL_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TERMINAL_USERNAME) -or [string]::IsNullOrWhiteSpace($env:TERMINAL_PASSWORD)) {
            Write-Host "::error::Set TERMINAL_USERNAME and TERMINAL_PASSWORD repository secrets before starting the public terminal."
            exit 1
          }
          $env:PATH = "$PWD\zig-out\bin;$env:PATH"
          # Clean up any stale processes from a previous run
          Get-Process -Name "ttyd" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name "cloudflared" -ErrorAction SilentlyContinue | Stop-Process -Force
          # Keep ttyd diagnostics so a dead origin is visible in the Actions log.
          $credential = "$($env:TERMINAL_USERNAME):$($env:TERMINAL_PASSWORD)"
          $ttydProcess = Start-Process -FilePath ".\ttyd.exe" -ArgumentList @("-W","-p","8899","-c","`"$credential`"","powershell.exe") -NoNewWindow -PassThru -RedirectStandardOutput "$PWD\ttyd.out.log" -RedirectStandardError "$PWD\ttyd.err.log"
          # Tunggu sampai ttyd benar-benar listen di port 8899 (mencegah 504 dari cloudflared)
          $ttydReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            $ttydProcess.Refresh()
            if ($ttydProcess.HasExited) {
              Write-Host "ERROR: ttyd exited during startup (exit code $($ttydProcess.ExitCode))"
              Get-Content ".\ttyd.out.log" -ErrorAction SilentlyContinue
              Get-Content ".\ttyd.err.log" -ErrorAction SilentlyContinue
              exit 1
            }
            if (Test-NetConnection -ComputerName 127.0.0.1 -Port 8899 -InformationLevel Quiet) {
              $ttydReady = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ttydReady) {
            Write-Host "ERROR: ttyd tidak listen di port 8899 setelah 30 detik"
            Get-Content ".\ttyd.out.log" -ErrorAction SilentlyContinue
            Get-Content ".\ttyd.err.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "=== PUBLIC URL BELOW (open in browser) ==="
          # cloudflared chạy nền; URL tunnel in trực tiếp lên stdout (job log), không redirect sang file
          $tunnelProcess = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel","--url","http://127.0.0.1:8899" -NoNewWindow -PassThru
          $DUR = [int]("${{ github.event.inputs.duration || 60 }}")
          Write-Host "Keeping terminal alive for $DUR minutes..."
          try {
            for ($elapsed = 0; $elapsed -lt ($DUR * 60); $elapsed += 5) {
              Start-Sleep -Seconds ([Math]::Min(5, ($DUR * 60) - $elapsed))
              $ttydProcess.Refresh()
              $tunnelProcess.Refresh()
              if ($ttydProcess.HasExited -or -not (Test-NetConnection -ComputerName 127.0.0.1 -Port 8899 -InformationLevel Quiet)) {
                Write-Host "ERROR: ttyd stopped serving port 8899"
                Get-Content ".\ttyd.out.log" -ErrorAction SilentlyContinue
                Get-Content ".\ttyd.err.log" -ErrorAction SilentlyContinue
                exit 1
              }
              if ($tunnelProcess.HasExited) {
                Write-Host "ERROR: cloudflared exited (exit code $($tunnelProcess.ExitCode))"
                exit 1
              }
            }
          }
          finally {
            if (-not $tunnelProcess.HasExited) { Stop-Process -Id $tunnelProcess.Id -Force -ErrorAction SilentlyContinue }
            if (-not $ttydProcess.HasExited) { Stop-Process -Id $ttydProcess.Id -Force -ErrorAction SilentlyContinue }
          }
